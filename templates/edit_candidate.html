<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Candidate | ResumeRank</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="navbar"><div class="brand"><div class="brand-icon">RR</div><div class="brand-text"><h2>ResumeRank</h2><span>Resume Screening System</span></div></div><nav class="nav-links"><a href="{{ url_for('index') }}">Screen Resumes</a><a class="active" href="{{ url_for('dashboard') }}">Dashboard</a></nav></header><main class="candidate-container"><a class="back-link" href="{{ url_for('candidate',candidate_id=candidate.id) }}">← Back to Candidate</a><section class="form-card"><div class="card-header"><div class="card-number">02</div><div><span class="card-label">CRUD — UPDATE</span><h2>Edit Candidate</h2></div></div><p class="card-description">Update recruiter-facing candidate information. ML scores remain unchanged.</p><form method="POST" class="edit-grid"><label>Candidate Name<input name="candidate_name" required value="{{ candidate.name }}"></label><label>Email<input type="email" name="email" value="{{ candidate.email }}"></label><label>Phone<input name="phone" value="{{ candidate.phone }}"></label><label>Status<select name="status"><option {{ 'selected' if candidate.status=='Shortlisted' }}>Shortlisted</option><option {{ 'selected' if candidate.status=='Under Review' }}>Under Review</option><option {{ 'selected' if candidate.status=='Rejected' }}>Rejected</option></select></label><label>Recruiter Decision<select name="recruiter_decision"><option {{ 'selected' if candidate.recruiter_decision=='Pending' }}>Pending</option><option {{ 'selected' if candidate.recruiter_decision=='Hired' }}>Hired</option><option {{ 'selected' if candidate.recruiter_decision=='Rejected' }}>Rejected</option><option {{ 'selected' if candidate.recruiter_decision=='Maybe' }}>Maybe</option></select></label><label class="wide">Feedback Notes<textarea name="feedback_notes" rows="6">{{ candidate.feedback_notes }}</textarea></label><div class="candidate-actions wide"><a class="secondary-btn" href="{{ url_for('candidate',candidate_id=candidate.id) }}">Cancel</a><button class="primary-btn">Save Changes</button></div></form></section></main><footer class="site-footer"><strong>ResumeRank</strong><span>AI Resume Screening System</span></footer></body></html>
